<!doctype html>
<html lang="vi">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F5EA">
  <meta name="description" content="Thiệp chúc mừng Ngày Nhà giáo Việt Nam 20/11 — gửi lời tri ân và những lời chúc tốt đẹp đến quý thầy cô.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Kính chúc thầy cô một ngày 20/11 thật ý nghĩa">
  <meta property="og:description" content="Một tấm thiệp nhỏ, gửi trọn lời tri ân. Chạm để mở thiệp chúc mừng Ngày Nhà giáo Việt Nam.">
  <title>Thiệp chúc mừng Ngày Nhà giáo Việt Nam 20/11</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="Thiệp chúc mừng.png">
  <style>
    :root{--sage:#84917A;--olive:#56654A;--gold:#C6A45D;--ivory:#F7F5EA;--forest:#2F472F;--view-height:100vh}
    @supports(height:100svh){:root{--view-height:100svh}}
    *{box-sizing:border-box}
    html{background:var(--ivory)}
    body{margin:0;min-width:320px;min-height:100vh;min-height:100dvh;overflow-x:hidden;color:var(--forest);font-family:"Be Vietnam Pro",sans-serif}
    button{font-family:"Be Vietnam Pro",sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    button:focus-visible{outline:3px solid var(--forest);outline-offset:6px}
    .stage{position:relative;height:100vh;height:100dvh;isolation:isolate;background:radial-gradient(ellipse at 50% 32%,#fffdf5 0%,#f7f5ea 57%,#e9e7db 100%);overflow:hidden}
    .stage:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.34;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.15'/%3E%3C/svg%3E")}
    .closed-view{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,4vh,38px);padding:calc(22px + env(safe-area-inset-top)) 16px calc(25px + env(safe-area-inset-bottom));transition:opacity .65s ease-in-out,transform .8s ease-in-out}
    .envelope-scene{position:relative;width:min(78vw,390px,calc((var(--view-height) - 135px - env(safe-area-inset-top) - env(safe-area-inset-bottom))*.605));aspect-ratio:.605;perspective:1100px;filter:drop-shadow(0 38px 28px rgba(37,48,33,.27)) drop-shadow(0 8px 7px rgba(37,48,33,.18));transform:translateZ(0);transition:transform 1.8s ease-in-out}
    .envelope{position:absolute;inset:0;transform-style:preserve-3d;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(251,241,207,.38),inset 0 0 30px rgba(31,54,34,.17),0 2px 4px rgba(37,54,36,.2);background:linear-gradient(132deg,#a7b3a0 0%,#879b87 37%,#738b78 72%,#647b6b 100%);overflow:visible}
    .envelope:before,.flap:after,.letter-proxy:after{content:"";position:absolute;inset:0;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 150 150' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='t'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23t)' opacity='.16'/%3E%3C/svg%3E");mix-blend-mode:soft-light;opacity:.65}
    .letter-proxy{position:absolute;z-index:1;left:8%;top:7%;width:84%;aspect-ratio:1240/1748;border:7px solid #f7f5ea;background:#f2f0e6 url("Thiệp chúc mừng.png") center/contain no-repeat;box-shadow:0 9px 22px rgba(20,35,18,.26);transform:translateY(3%) scale(.92);transition:transform 1.2s cubic-bezier(.22,.8,.25,1);opacity:1}
    .flap{position:absolute;inset:0;backface-visibility:visible;transform-style:preserve-3d;transition:transform 1.35s cubic-bezier(.22,.8,.25,1);filter:drop-shadow(0 2px 2px rgba(31,50,33,.3))}
    .flap-left{z-index:3;clip-path:polygon(0 0,53% 49%,0 100%);background:linear-gradient(102deg,#b3bfae 0%,#9eaf9d 15%,#78927f 72%,#647d6c 100%);transform-origin:left center}
    .flap-right{z-index:4;clip-path:polygon(100% 0,47% 49%,100% 100%);background:linear-gradient(258deg,#a8b9a6 0%,#8fa591 22%,#708a77 77%,#5f7969 100%);transform-origin:right center}
    .flap-bottom{z-index:5;clip-path:polygon(0 100%,50% 43%,100% 100%);background:linear-gradient(0deg,#718a76 0%,#92a995 42%,#b1c0ab 84%,#d0d3b8 100%);transform-origin:center bottom}
    .flap-top{z-index:6;clip-path:polygon(0 0,100% 0,50% 57%);background:linear-gradient(159deg,#c0cab7 0%,#a6b8a3 22%,#8da58f 53%,#718976 85%,#607865 100%);transform-origin:center top}
    .flap:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(112deg,rgba(255,255,234,.24),transparent 34%,rgba(30,52,35,.13) 100%);mix-blend-mode:soft-light}
    .crease{position:absolute;z-index:7;inset:0;pointer-events:none;opacity:.6;background:linear-gradient(137deg,transparent 49.75%,rgba(245,235,202,.34) 50%,transparent 50.25%) top left/50% 52% no-repeat,linear-gradient(223deg,transparent 49.75%,rgba(245,235,202,.3) 50%,transparent 50.25%) top right/50% 52% no-repeat;transition:opacity .4s}
    .botanical{position:absolute;z-index:8;pointer-events:none;width:30%;height:29%;opacity:.9;filter:drop-shadow(0 1px 0 rgba(48,69,46,.65)) drop-shadow(0 -1px 0 rgba(255,245,204,.22));transition:opacity .5s}
    .botanical svg{width:100%;height:100%;overflow:visible}
    .botanical path{fill:none;stroke:#dbc37e;stroke-width:1.35;stroke-linecap:round}
    .botanical ellipse{fill:rgba(217,187,110,.2);stroke:#e6ce91;stroke-width:1.1}
    .botanical.one{top:9%;left:8%;transform:rotate(-19deg)}
    .botanical.two{right:8%;bottom:7%;transform:rotate(163deg)}
    .botanical.three{right:7%;top:13%;width:21%;height:22%;transform:rotate(35deg);opacity:.66}
    .seal{position:absolute;z-index:10;top:50%;left:50%;width:clamp(112px,48%,154px);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:49% 52% 48% 51%;padding:0;cursor:pointer;color:#51320f;transform:translate(-50%,-50%);background:radial-gradient(circle at 29% 21%,#fff0b2 0%,#e8c977 20%,#c99b43 55%,#a4732c 82%,#805724 100%);box-shadow:inset 0 0 0 2px rgba(255,231,151,.63),inset 0 0 0 7px rgba(116,72,25,.16),inset -7px -9px 12px rgba(88,48,15,.42),inset 6px 6px 11px rgba(255,245,186,.63),0 3px 0 #865b2c,0 8px 6px rgba(28,40,26,.38),0 16px 22px rgba(28,40,26,.25);transition:transform .55s ease-in-out,opacity .45s ease,box-shadow .55s ease}
    .seal:before{content:"";position:absolute;inset:10%;border:1px solid rgba(109,71,25,.7);border-radius:50%;box-shadow:0 1px 0 rgba(255,248,199,.77),inset 0 2px 3px rgba(96,67,30,.28)}
    .seal span{position:relative;display:block;text-align:center;font-family:"Playfair Display",serif;font-weight:700;font-size:clamp(14px,4vw,18px);letter-spacing:-.045em;line-height:1.2;text-shadow:0 1px 0 rgba(255,237,163,.8);white-space:nowrap}
    .instruction{margin:0;text-align:center;font-size:13px;letter-spacing:.06em;color:#66735f;line-height:1.7;transition:opacity .4s}
    .stage.opening .seal{transform:translate(-50%,-60%) scale(1.12);box-shadow:0 0 25px rgba(214,178,91,.8),0 20px 20px rgba(33,45,30,.3);animation:seal-away 1s ease-in-out forwards}
    @keyframes seal-away{0%,35%{opacity:1}100%{opacity:0;transform:translate(-50%,-100%) scale(1.2)}}
    .stage.opening .flap-top{transition-delay:.35s;transform:rotateX(155deg)}
    .stage.opening .flap-left{transition-delay:.65s;transform:rotateY(-150deg)}
    .stage.opening .flap-right{transition-delay:.8s;transform:rotateY(150deg)}
    .stage.opening .flap-bottom{transition-delay:.95s;transform:rotateX(-150deg)}
    .stage.opening .letter-proxy{transition-delay:1.2s;transform:translateY(-14%) scale(1.03)}
    .stage.opening .botanical,.stage.opening .crease,.stage.opening .instruction{opacity:0}
    .stage.opening .envelope-scene{transform:translateY(7%) scale(.76)}
    .stage.revealing .closed-view{opacity:0;pointer-events:none;transform:translateY(30px) scale(.94)}
    .stage.revealing .letter-proxy{opacity:0}
    .read-view{position:absolute;z-index:3;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:calc(12px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));opacity:0;visibility:hidden;pointer-events:none}
    .read-view::-webkit-scrollbar{display:none}
    .stage.opened .closed-view{opacity:0;visibility:hidden;pointer-events:none}
    .stage.revealing .read-view,.stage.opened .read-view{visibility:visible;opacity:1}
    .stage.opened .read-view{pointer-events:auto}
    .read-inner{width:min(100%,550px);min-height:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
    .card-mat{width:100%;padding:clamp(7px,2vw,12px);background:#f8f6ed;box-shadow:0 4px 8px rgba(51,61,40,.09),0 21px 55px rgba(51,61,40,.21),inset 0 0 0 1px rgba(198,164,93,.18)}
    .stage.revealing .card-mat{transform-origin:top left;will-change:transform}
    .close-button{opacity:0;pointer-events:none}
    .stage.opened .close-button{opacity:1;pointer-events:auto;transition:opacity .4s ease,background .2s,transform .2s}
    .card-image{display:block;width:100%;height:auto;aspect-ratio:1240/1748;object-fit:contain;background:#f7f5ea;box-shadow:0 1px 2px rgba(40,53,35,.10),0 9px 22px rgba(40,53,35,.13);filter:contrast(1.025) saturate(.97);transform:translateZ(0)}
    .close-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border:1px solid rgba(86,101,74,.4);border-radius:999px;background:rgba(247,245,234,.88);color:var(--forest);font-size:13px;font-weight:500;letter-spacing:.055em;cursor:pointer;transition:background .2s,transform .2s}
    .close-button:hover{background:#e9ecdf;transform:translateY(-2px)}
    .close-button svg{width:15px;height:15px}
    @media(min-width:700px){.read-view{padding-top:40px;padding-bottom:40px}.envelope-scene{width:min(36vw,390px,calc((var(--view-height) - 150px - env(safe-area-inset-top) - env(safe-area-inset-bottom))*.605))}}
    @media(max-height:560px){.closed-view{gap:12px}.envelope-scene{width:min(70vw,calc((var(--view-height) - 105px - env(safe-area-inset-top) - env(safe-area-inset-bottom))*.605))}}
  </style>
 </head>
 <body>
  <main id="invitation" class="stage canva-section" data-state="closed">
   <section id="closed-view" class="closed-view canva-section" aria-label="Phong bì thiệp chúc mừng">
    <div class="envelope-scene" aria-hidden="false">
     <div class="envelope">
      <div class="letter-proxy" aria-hidden="true"></div>
      <div class="flap flap-left" aria-hidden="true"></div>
      <div class="flap flap-right" aria-hidden="true"></div>
      <div class="flap flap-bottom" aria-hidden="true"></div>
      <div class="flap flap-top" aria-hidden="true"></div>
      <div class="crease" aria-hidden="true"></div>
      <div class="botanical one" aria-hidden="true">
       <svg viewbox="0 0 100 130">
        <path d="M42 126C69 86 23 57 69 4" /><ellipse cx="55" cy="20" rx="10" ry="19" transform="rotate(41 55 20)" /><ellipse cx="45" cy="42" rx="9" ry="17" transform="rotate(-41 45 42)" /><ellipse cx="61" cy="56" rx="9" ry="17" transform="rotate(39 61 56)" /><ellipse cx="41" cy="76" rx="9" ry="18" transform="rotate(-44 41 76)" /><ellipse cx="58" cy="96" rx="8" ry="16" transform="rotate(42 58 96)" />
       </svg>
      </div>
      <div class="botanical two" aria-hidden="true">
       <svg viewbox="0 0 100 130">
        <path d="M42 126C69 86 23 57 69 4" /><ellipse cx="55" cy="20" rx="10" ry="19" transform="rotate(41 55 20)" /><ellipse cx="45" cy="42" rx="9" ry="17" transform="rotate(-41 45 42)" /><ellipse cx="61" cy="56" rx="9" ry="17" transform="rotate(39 61 56)" /><ellipse cx="41" cy="76" rx="9" ry="18" transform="rotate(-44 41 76)" /><ellipse cx="58" cy="96" rx="8" ry="16" transform="rotate(42 58 96)" />
       </svg>
      </div>
      <div class="botanical three" aria-hidden="true">
       <svg viewbox="0 0 100 130">
        <path d="M42 126C69 86 23 57 69 4" /><ellipse cx="55" cy="20" rx="10" ry="19" transform="rotate(41 55 20)" /><ellipse cx="45" cy="42" rx="9" ry="17" transform="rotate(-41 45 42)" /><ellipse cx="61" cy="56" rx="9" ry="17" transform="rotate(39 61 56)" /><ellipse cx="41" cy="76" rx="9" ry="18" transform="rotate(-44 41 76)" /><ellipse cx="58" cy="96" rx="8" ry="16" transform="rotate(42 58 96)" />
       </svg>
      </div><button id="seal-button" class="seal canva-button" type="button" aria-label="Chạm vào con dấu TTCUDVC PBC để mở thiệp"><span>TTCUDVC</span><span>PBC</span></button>
     </div>
    </div>
    <p id="opening-instruction" class="instruction canva-text">Chạm vào con dấu để mở thiệp</p>
   </section>
   <section id="read-view" class="read-view canva-section" aria-label="Thiệp chúc mừng Ngày Nhà giáo Việt Nam" aria-hidden="true">
    <div class="read-inner">
     <div class="card-mat canva-card"><img id="greeting-card-image" class="card-image canva-image" src="Thiệp chúc mừng.png" width="1240" height="1748" alt="Thiệp chúc mừng Ngày Nhà giáo Việt Nam 20/11 của Trung tâm Cung ứng dịch vụ công phường Bàn Cờ, trang trí hoa hướng dương và lời tri ân thầy cô" loading="eager" decoding="async">
     </div><button id="close-button" class="close-button canva-button" type="button" tabindex="-1">
      <svg viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
       <path d="m15 18-6-6 6-6" />
      </svg>Xem lại phong bì</button>
    </div>
   </section>
  </main>
  <script>
    (function(){
      const stage=document.getElementById('invitation');
      const seal=document.getElementById('seal-button');
      const closed=document.getElementById('closed-view');
      const read=document.getElementById('read-view');
      const close=document.getElementById('close-button');
      const letter=document.querySelector('.letter-proxy');
      const card=document.querySelector('.card-mat');
      let timer;
      let flight;
      function opened(){
        stage.classList.add('opened');
        stage.classList.remove('opening','revealing');
        if(flight){flight.cancel();flight=null;}
        stage.dataset.state='opened';
        closed.setAttribute('aria-hidden','true');
        read.setAttribute('aria-hidden','false');
        close.tabIndex=0;
        seal.tabIndex=-1;
        read.scrollTop=0;
        close.focus({preventScroll:true});
      }
      function reveal(){
        // Continue from the little card inside the envelope to the reading size.
        // Both views use the same image, so there is no cut between two scenes.
        const from=letter.getBoundingClientRect();
        read.scrollTop=0;
        const to=card.getBoundingClientRect();
        stage.classList.add('revealing');
        if(!card.animate){opened();return;}
        flight=card.animate([
          {transform:`translate(${from.left-to.left}px,${from.top-to.top}px) scale(${from.width/to.width},${from.height/to.height}) rotate(0deg)`},
          {transform:`translate(${(from.left-to.left)*.45}px,${(from.top-to.top)*.45-24}px) scale(${.55+.45*from.width/to.width},${.55+.45*from.height/to.height}) rotate(-2deg)`,offset:.55},
          {transform:'translate(0,0) scale(1,1) rotate(0deg)'}
        ],{duration:1450,easing:'cubic-bezier(.22,.8,.25,1)',fill:'both'});
        flight.finished.then(opened).catch(function(){});
      }
      seal.addEventListener('click',function(){
        if(stage.dataset.state!=='closed')return;
        stage.dataset.state='opening';
        stage.classList.add('opening');
        seal.disabled=true;
        timer=setTimeout(reveal,2500);
      });
      close.addEventListener('click',function(){
        clearTimeout(timer);
        if(flight){flight.cancel();flight=null;}
        stage.classList.remove('opened','opening','revealing');
        stage.dataset.state='closed';
        closed.setAttribute('aria-hidden','false');
        read.setAttribute('aria-hidden','true');
        close.tabIndex=-1;
        seal.tabIndex=0;
        seal.disabled=false;
        read.scrollTop=0;
        seal.focus({preventScroll:true});
      });
    })();
  </script>
 </body>
</html>
