<!doctype html>
<html lang="vi">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F5EA">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Trung tâm Cung ứng dịch vụ công phường Bàn Cờ 💌 TTCUDVCPBC | Tri ân quý thầy, cô nhân Ngày Nhà giáo Việt Nam 20/11">
  <meta property="og:description" content="Một tấm thiệp nhỏ, gửi trọn lời tri ân. Chạm để mở thiệp chúc mừng Ngày Nhà giáo Việt Nam.">
  <title>Thiệp chúc mừng Ngày Nhà giáo Việt Nam 20/11</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="bia-thiep.png">
  <style>:root{--view-height:100vh;--forest:#24472e;--gold:#b98926;--ink:#223c29}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Be Vietnam Pro',Arial,sans-serif}body{background:radial-gradient(ellipse at 50% 15%,#fffdf8,#ede8dc 80%);color:var(--ink)}.stage{min-height:100dvh;display:grid;place-items:center;padding:30px 12px 48px;overflow:hidden}.scene{width:min(90vw,430px,calc((var(--view-height) - 110px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * .6905));position:relative;display:grid;place-items:center;perspective:1100px}.envelope{display:block;width:100%;height:auto;filter:drop-shadow(0 15px 21px rgba(17,45,24,.22));transform-origin:center center;transition:transform 1.1s cubic-bezier(.26,.7,.2,1),opacity .75s ease,filter .8s;user-select:none;pointer-events:none}.seal{position:absolute;left:50%;top:56.5%;width:33%;height:17%;transform:translate(-50%,-50%);border:0;border-radius:50%;background:transparent;cursor:pointer;z-index:2;touch-action:manipulation}.seal:focus-visible{outline:4px solid #fff;box-shadow:0 0 0 7px var(--gold)}.seal::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(255,244,189,.0);transition:border-color .3s,box-shadow .3s}.seal:hover::after,.seal:focus-visible::after{border-color:#fff9cb;box-shadow:0 0 25px #f7d885}.hint{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);background:rgba(255,255,250,.92);color:#294b31;border:1px solid rgba(168,142,66,.28);border-radius:80px;padding:11px 17px;white-space:nowrap;font-size:clamp(11px,2.8vw,13px);font-weight:600;box-shadow:0 6px 15px rgba(0,0,0,.1);pointer-events:none;transition:opacity .35s}.hint::before{content:'✦';color:var(--gold);margin-right:7px}.scene.open .envelope{transform:translateY(22vh) scale(.72) rotateX(-38deg);opacity:0;filter:blur(6px)}.scene.open .seal,.scene.open .hint{opacity:0;pointer-events:none}.letter{display:none;position:fixed;inset:0;z-index:10;background:linear-gradient(145deg,#f9f7ed,#e8ecd9);overflow-y:auto;opacity:0;transform:translateY(90px) scale(.94);transition:opacity .8s ease,transform .9s cubic-bezier(.2,.8,.2,1)}.letter.visible{display:flex;flex-direction:column;align-items:center}.letter.show{opacity:1;transform:translateY(0) scale(1)}
@supports(height:100svh){:root{--view-height:100svh}}
.stage{padding-top:calc(30px + env(safe-area-inset-top));padding-bottom:calc(48px + env(safe-area-inset-bottom))}
.scene:not(.open) .envelope{will-change:transform,opacity}
.scene.open .envelope{will-change:transform,opacity,filter}
.letter{padding:calc(28px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.letter.visible{justify-content:flex-start}
.read-inner{width:min(100%,550px,calc((var(--view-height) - 145px) * .5625));min-height:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.paper{width:100%;padding:clamp(7px,2vw,12px);background:#fffdf4;border:1px solid #d5c996;box-shadow:0 15px 55px #45604924}
.card-video{display:block;width:100%;height:auto;aspect-ratio:9/16;object-fit:contain;background:#f7f5ea}
.back-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border:1px solid #56654a66;border-radius:999px;background:#f7f5eae0;color:var(--forest);font:500 13px 'Be Vietnam Pro',Arial,sans-serif;cursor:pointer;touch-action:manipulation}
.back-button:hover{background:#e9ecdf}.back-button:focus-visible{outline:3px solid #b98926;outline-offset:5px}.back-button svg{width:15px;height:15px}
@media(max-height:620px){.stage{padding-top:12px;padding-bottom:24px}.scene{width:min(64vw,300px,calc((var(--view-height) - 55px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * .6905))}.hint{bottom:5%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}.envelope{will-change:auto!important}}
</style>
 </head>
 <body>
  <main class="stage">
   <div class="scene" id="scene">
    <img class="envelope" src="bia-thiep.png" width="1042" height="1509" alt="Bì thư xanh hoa văn nổi, con dấu vàng TTCUDVC PBC" fetchpriority="high" decoding="async">
    <button class="seal" id="seal" type="button" aria-label="Nhấn vào con dấu TTCUDVC PBC để mở video" title="Mở thiệp"></button>
    <div class="hint" aria-hidden="true">Chạm vào con dấu để mở thiệp</div>
   </div>
  </main>
  <section class="letter" id="letter" aria-label="Video chúc mừng Ngày Nhà giáo Việt Nam" aria-hidden="true" inert>
   <div class="read-inner">
    <div class="paper">
     <video id="greeting-card-video" class="card-video" width="1080" height="1920" controls playsinline preload="metadata" tabindex="-1" aria-label="Video chúc mừng Ngày Nhà giáo Việt Nam 20/11">
      <source src="20_11.mp4" type="video/mp4">
      Trình duyệt của bạn không hỗ trợ video. <a href="20_11.mp4">Mở video chúc mừng 20/11</a>.
     </video>
    </div>
    <button class="back-button" id="close" type="button" tabindex="-1">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Xem lại bìa thiệp
    </button>
   </div>
  </section>
  <script>
(function(){
  const scene=document.getElementById('scene');
  const seal=document.getElementById('seal');
  const letter=document.getElementById('letter');
  const closeBtn=document.getElementById('close');
  const video=document.getElementById('greeting-card-video');
  const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
  let state='closed',timer,firstFrame,secondFrame;
  function openLetter(){
    if(state!=='closed')return;
    state='opening';
    scene.classList.add('open');
    seal.disabled=true;
    seal.tabIndex=-1;
    clearTimeout(timer);
    timer=setTimeout(function(){
      letter.classList.add('visible');
      letter.inert=false;
      letter.setAttribute('aria-hidden','false');
      scene.setAttribute('aria-hidden','true');
      firstFrame=window.requestAnimationFrame(function(){
        secondFrame=window.requestAnimationFrame(function(){
          if(state!=='opening')return;
          letter.classList.add('show');
          state='opened';
          letter.scrollTop=0;
          closeBtn.tabIndex=0;
          video.tabIndex=0;
          video.focus({preventScroll:true});
          const playback=video.play();
          if(playback)playback.catch(function(){
            // The native play control remains available if autoplay is blocked.
          });
        });
      });
    },reducedMotion.matches?0:560);
  }
  function closeLetter(){
    if(state==='closed'||state==='closing')return;
    state='closing';
    clearTimeout(timer);
    window.cancelAnimationFrame(firstFrame);
    window.cancelAnimationFrame(secondFrame);
    video.pause();
    if(video.readyState>0)video.currentTime=0;
    video.tabIndex=-1;
    closeBtn.tabIndex=-1;
    letter.classList.remove('show');
    letter.inert=true;
    letter.setAttribute('aria-hidden','true');
    scene.setAttribute('aria-hidden','false');
    seal.disabled=false;
    seal.tabIndex=0;
    seal.focus({preventScroll:true});
    timer=setTimeout(function(){
      letter.classList.remove('visible');
      scene.classList.remove('open');
      state='closed';
    },reducedMotion.matches?0:410);
  }
  seal.addEventListener('click',openLetter);
  closeBtn.addEventListener('click',closeLetter);
  document.addEventListener('keydown',function(event){
    if(event.key==='Escape'&&(state==='opened'||state==='opening'))closeLetter();
  });
})();
  </script>
 </body>
</html>
